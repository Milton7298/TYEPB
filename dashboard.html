<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: "Microsoft JhengHei", sans-serif; padding: 20px; }
        .card-counter { box-shadow: 0 4px 8px rgba(0,0,0,0.1); border: none; border-radius: 10px; transition: .3s; }
        .card-counter:hover { transform: translateY(-5px); box-shadow: 0 8px 15px rgba(0,0,0,0.1); }
        .icon-box { font-size: 2.5rem; opacity: 0.3; }
        .h-custom { height: 100%; }
        
        /* --- 靜態 GIS 模擬地圖樣式 --- */
        .static-map-container {
            position: relative;
            width: 100%;
            height: 350px;
            /* 使用維基百科開源的桃園地圖作為底圖 */
            background: #e2e8f0 url('https://upload.wikimedia.org/wikipedia/commons/thumb/c/c8/Taiwan_Taoyuan_City_location_map.svg/800px-Taiwan_Taoyuan_City_location_map.svg.png') no-repeat center center;
            background-size: cover;
            border-bottom-left-radius: 0.375rem;
            border-bottom-right-radius: 0.375rem;
            overflow: hidden;
        }
        
        /* 加上科技感網格遮罩，讓一般地圖看起來更像系統圖資 */
        .static-map-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(240, 248, 255, 0.65);
            background-image: linear-gradient(#cbd5e1 1px, transparent 1px), linear-gradient(90deg, #cbd5e1 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: 1;
        }

        /* 點位樣式 */
        .map-pin {
            position: absolute;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 2px solid #fff;
            box-shadow: 0 0 8px rgba(0,0,0,0.6);
            transform: translate(-50%, -50%);
            z-index: 2;
            cursor: pointer;
        }
        
        .pin-normal { background-color: #198754; }
        .pin-alert { background-color: #dc3545; animation: pulse-alert 1.5s infinite; }
        
        /* 點位資訊卡 */
        .pin-label {
            position: absolute;
            top: 100%; left: 50%;
            transform: translateX(-50%);
            margin-top: 8px;
            background: rgba(255, 255, 255, 0.95);
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: bold;
            color: #2c3e50;
            white-space: nowrap;
            box-shadow: 0 3px 6px rgba(0,0,0,0.15);
            border: 1px solid #dee2e6;
            z-index: 3;
            text-align: center;
        }

        /* 紅色警報閃爍特效 */
        @keyframes pulse-alert {
            0% { box-shadow: 0 0 0 0 rgba(220, 53, 69, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(220, 53, 69, 0); }
            100% { box-shadow: 0 0 0 0 rgba(220, 53, 69, 0); }
        }
    </style>
</head>
<body>

    <h4 class="mb-4 fw-bold text-secondary"><i class="fas fa-tachometer-alt me-2"></i>系統運作儀表板 (Dashboard)</h4>

    <div class="row g-4 mb-4">
        <div class="col-md-3">
            <div class="card card-counter bg-primary text-white h-custom p-3">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h6 class="text-uppercase mb-1">今日辨識總量</h6>
                        <h2 class="mb-0 fw-bold">1,245</h2>
                        <small>較昨日 +5%</small>
                    </div>
                    <i class="fas fa-camera icon-box"></i>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card card-counter bg-danger text-white h-custom p-3">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h6 class="text-uppercase mb-1">黑名單告警</h6>
                        <h2 class="mb-0 fw-bold">3</h2>
                        <small>未處理案件</small>
                    </div>
                    <i class="fas fa-exclamation-triangle icon-box"></i>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card card-counter bg-success text-white h-custom p-3">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h6 class="text-uppercase mb-1">API 上傳成功率</h6>
                        <h2 class="mb-0 fw-bold">99.8%</h2>
                        <small>正常運作中</small>
                    </div>
                    <i class="fas fa-cloud-upload-alt icon-box"></i>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card card-counter bg-warning text-dark h-custom p-3">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h6 class="text-uppercase mb-1">設備在線率</h6>
                        <h2 class="mb-0 fw-bold">92%</h2>
                        <small>2 支攝影機離線</small>
                    </div>
                    <i class="fas fa-video icon-box"></i>
                </div>
            </div>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-md-8">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-header bg-white fw-bold py-3 d-flex justify-content-between align-items-center">
                    <span><i class="fas fa-map-marked-alt me-2 text-primary"></i>最新違規熱點地圖 (即時連線)</span>
                    <span class="badge bg-success"><i class="fas fa-wifi me-1"></i>GIS 已連線</span>
                </div>
                <div class="card-body p-0">
                    
                    <div class="static-map-container">
                        <div class="static-map-overlay"></div>
                        
                        <div class="
