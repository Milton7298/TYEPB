<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>桃園市環保局非法棄置智慧圍籬系統 - 車牌辨識管理</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: "Microsoft JhengHei", sans-serif; }
        .header-section { background-color: #2c3e50; color: white; padding: 20px 0; margin-bottom: 20px; }
        .card { box-shadow: 0 4px 6px rgba(0,0,0,0.1); border: none; margin-bottom: 20px; }
        .img-thumbnail-custom { width: 100px; height: 60px; object-fit: cover; cursor: pointer; border: 2px solid #dee2e6; background-color: #e9ecef; display: flex; align-items: center; justify-content: center; color: #6c757d; font-size: 0.75rem; transition: transform 0.2s, border-color 0.2s; overflow: hidden; }
        .img-thumbnail-custom img { width: 100%; height: 100%; object-fit: cover; }
        .img-thumbnail-custom:hover { border-color: #0d6efd; transform: scale(1.05); }
        .nav-tabs .nav-link { color: #495057; font-weight: bold; }
        .nav-tabs .nav-link.active { color: #0d6efd; border-top: 3px solid #0d6efd; }
        .badge-recog-success { background-color: #198754; }
        .badge-recog-fail { background-color: #dc3545; }
    </style>
</head>
<body>

<div class="header-section">
    <div class="container">
        <div class="d-flex justify-content-between align-items-center">
            <div>
                <h2 class="m-0"><i class="fas fa-car-side me-2"></i>桃園市環保局非法棄置智慧圍籬系統</h2>
                <p class="m-0 text-white-50">車牌辨識紀錄查詢與人工校正作業</p>
            </div>
            <div class="text-end">
                <span class="badge bg-warning text-dark"><i class="fas fa-image me-1"></i>KER-5379 實測影像整合版</span>
            </div>
        </div>
    </div>
</div>

<div class="container mb-5">
    <ul class="nav nav-tabs mb-4" id="myTab">
        <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#query-content"><i class="fas fa-search me-1"></i> 辨識資料查詢</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#adjust-content"><i class="fas fa-wrench me-1"></i> 無法辨識案件調整 <span class="badge bg-danger rounded-pill ms-1" id="unrecognizedCount">0</span></button></li>
    </ul>

    <div class="tab-content" id="myTabContent">
        <div class="tab-pane fade show active" id="query-content">
            <div class="card p-4">
                <div class="row g-3 align-items-end">
                    <div class="col-md-4">
                        <label class="form-label fw-bold">拍攝時間區間</label>
                        <div class="input-group">
                            <input type="date" class="form-control" id="qDateStart">
                            <span class="input-group-text">~</span><input type="date" class="form-control" id="qDateEnd">
                        </div>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-bold">點位/設備</label>
                        <select class="form-select" id="qLocation">
                            <option value="">所有地點</option>
                            <option value="新屋區">新屋區 (LOCA_..._0001)</option>
                            <option value="觀音區">觀音區 (LOCA_..._0002)</option>
                            <option value="大園區">大園區 (LOCA_..._0003)</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label fw-bold">狀態</label>
                        <select class="form-select" id="qStatus"><option value="">全部</option><option value="1">有效案件</option><option value="0">無效</option></select>
                    </div>
                    <div class="col-md-3 text-end"><button class="btn btn-primary" onclick="renderQueryTable()"><i class="fas fa-search"></i> 查詢</button></div>
                </div>
            </div>

            <div class="card">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover table-striped mb-0 align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th width="15%">辨識日期時間</th>
                                    <th width="20%">設備 ID (SiteID)</th>
                                    <th width="10%">辨識車牌</th>
                                    <th width="12%">車頭照片</th>
                                    <th width="12%">車斗照片</th>
                                    <th width="12%">車尾照片</th>
                                    <th width="8%">狀態</th>
                                    <th width="11%">操作</th>
                                </tr>
                            </thead>
                            <tbody id="queryTableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <div class="tab-pane fade" id="adjust-content">
             <div class="card p-4">
                <div class="row g-3 align-items-end">
                    <div class="col-md-4"><label class="form-label fw-bold">發生時間</label><input type="date" class="form-control" id="aDate"></div>
                    <div class="col-md-4 text-end"><button class="btn btn-primary" onclick="renderAdjustTable()"><i class="fas fa-filter"></i> 篩選</button></div>
                </div>
            </div>

            <div class="card">
                <div class="card-header bg-warning bg-opacity-10 fw-bold text-dark border-bottom">待人工校正列表</div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-bordered mb-0 align-middle text-center">
                            <thead class="table-light">
                                <tr>
                                    <th width="15%">時間/設備ID</th>
                                    <th width="15%">車頭照片</th>
                                    <th width="15%">車斗照片</th>
                                    <th width="15%">車尾照片</th>
                                    <th width="25%">人工校正結果</th>
                                    <th width="15%">功能</th>
                                </tr>
                            </thead>
                            <tbody id="adjustTableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="imgModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header"><h5 class="modal-title">影像檢視</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
            <div class="modal-body text-center bg-dark p-0"><img src="" id="modalImg" class="img-fluid" style="max-height: 500px; width: 100%; object-fit: contain;"></div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function createMockImage(text, subText, color) {
        const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="400" height="250" viewBox="0 0 400 250"><rect width="400" height="250" fill="#333"/><rect x="20" y="20" width="360" height="210" fill="#e9ecef" rx="10"/><text x="50%" y="45%" dominant-baseline="middle" text-anchor="middle" font-family="monospace" font-weight="bold" font-size="28" fill="${color}">${text}</text><text x="50%" y="60%" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#6c757d">${subText}</text></svg>`;
        return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
    }

    let lprData = [
        { 
            id: 101, time: "2023-11-27 10:05:00", loc: "新屋區", siteId: "LOCA_68000_2026_0001", plate: "KER-5379", active: true, status: 1,
            frontImg: "前截圖.jpg", bedImg: "車身照片.jpg", rearImg: "後截圖.jpg" 
        },
        { 
            id: 102, time: "2023-11-27 09:15:10", loc: "觀音區", siteId: "LOCA_68000_2026_0002", plate: "XYZ-5678", active: true, status: 1,
            frontImg: createMockImage("XYZ-5678", "車頭影像", "#333"), bedImg: createMockImage("XYZ-5678", "車斗影像", "#333"), rearImg: createMockImage("XYZ-5678", "車尾影像", "#333")
        },
        { 
            id: 103, time: "2023-11-27 10:20:00", loc: "大園區", siteId: "LOCA_68000_2026_0003", plate: "無法辨識", active: true, status: 0, 
            frontImg: createMockImage("無法辨識", "車頭過曝", "#dc3545"), bedImg: createMockImage("UNKNOWN", "車斗無特徵", "#dc3545"), rearImg: createMockImage("無法辨識", "無車尾牌", "#dc3545")
        }
    ];

    document.addEventListener('DOMContentLoaded', () => {
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('qDateStart').value = today; document.getElementById('qDateEnd').value = today; document.getElementById('aDate').value = today;
        renderQueryTable(); renderAdjustTable(); updateCount();
    });

    function updateCount() { document.getElementById('unrecognizedCount').innerText = lprData.filter(d => d.status === 0).length; }

    function renderQueryTable() {
        const tbody = document.getElementById('queryTableBody'); tbody.innerHTML = '';
        
        const locFilter = document.getElementById('qLocation').value;
        const statusFilter = document.getElementById('qStatus').value;

        const filtered = lprData.filter(item => {
            const matchLoc = locFilter ? item.loc.includes(locFilter) : true;
            const matchStatus = statusFilter ? (statusFilter === '1' ? item.active : !item.active) : true; 
            return matchLoc && matchStatus;
        });

        filtered.forEach(item => {
            let plateBadge = item.plate === "無法辨識" ? `<span class="badge badge-recog-fail">無法辨識</span>` : `<span class="badge badge-recog-success">${item.plate}</span>`;
            const imgError = `onerror="this.parentNode.innerHTML='<span class=\\'text-danger small\\'>找不到圖檔</span>'"`;
            tbody.innerHTML += `
                <tr>
                    <td class="font-monospace small">${item.time}</td>
                    <td class="font-monospace">${item.siteId}</td>
                    <td class="font-monospace fs-6">${plateBadge}</td>
                    <td><div class="img-thumbnail-custom" onclick="openImgModal('${item.frontImg}', '${item.plate} - 車頭')"><img src="${item.frontImg}" ${imgError}></div></td>
                    <td><div class="img-thumbnail-custom" onclick="openImgModal('${item.bedImg}', '${item.plate} - 車斗')"><img src="${item.bedImg}" ${imgError}></div></td>
                    <td><div class="img-thumbnail-custom" onclick="openImgModal('${item.rearImg}', '${item.plate} - 車尾')"><img src="${item.rearImg}" ${imgError}></div></td>
                    <td>${item.active ? '<span class="text-success small">啟用</span>' : '<span class="text-secondary small">停用</span>'}</td>
                    <td><button class="btn btn-sm btn-outline-primary"><i class="fas fa-download"></i></button></td>
                </tr>
            `;
        });
    }

    function renderAdjustTable() {
        const tbody = document.getElementById('adjustTableBody'); tbody.innerHTML = '';
        const filtered = lprData.filter(item => item.status === 0);
        if (filtered.length === 0) return tbody.innerHTML = '<tr><td colspan="6" class="text-center py-5 text-muted">無待處理案件</td></tr>';
        
        filtered.forEach(item => {
            const imgError = `onerror="this.parentNode.innerHTML='<span class=\\'text-danger small\\'>圖檔遺失</span>'"`;
            tbody.innerHTML += `
                <tr>
                    <td class="small text-start"><div class="fw-bold">${item.time}</div><div class="text-muted font-monospace">${item.siteId}</div></td>
                    <td><div class="img-thumbnail-custom mx-auto" onclick="openImgModal('${item.frontImg}', '待校正 - 車頭')"><img src="${item.frontImg}" ${imgError}></div></td>
                    <td><div class="img-thumbnail-custom mx-auto" onclick="openImgModal('${item.bedImg}', '待校正 - 車斗')"><img src="${item.bedImg}" ${imgError}></div></td>
                    <td><div class="img-thumbnail-custom mx-auto" onclick="openImgModal('${item.rearImg}', '待校正 - 車尾')"><img src="${item.rearImg}" ${imgError}></div></td>
                    <td><input type="text" class="form-control font-monospace fw-bold" id="input-${item.id}" placeholder="輸入正確車號" style="text-transform: uppercase;"></td>
                    <td><button class="btn btn-success w-100" onclick="submitCorrection(${item.id})">送出</button></td>
                </tr>
            `;
        });
    }

    function submitCorrection(id) {
        const newVal = document.getElementById(`input-${id}`).value.trim().toUpperCase();
        if (!newVal) return alert("請輸入車牌號碼！");
        const item = lprData.find(d => d.id === id);
        item.plate = newVal; item.status = 1;
        item.frontImg = createMockImage(newVal, "車頭影像 (校正後)", "#198754");
        item.bedImg = createMockImage(newVal, "車斗影像 (校正後)", "#198754");
        item.rearImg = createMockImage(newVal, "車尾影像 (校正後)", "#198754");
        renderAdjustTable(); renderQueryTable(); updateCount();
    }

    function openImgModal(src, title) {
        document.getElementById('modalImg').src = src; document.querySelector('.modal-title').innerText = title;
        new bootstrap.Modal(document.getElementById('imgModal')).show();
    }
</script>
</body>
</html>
