<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>桃園市環保局非法棄置智慧圍籬系統 - 即時影像監控</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* --- 系統核心風格 --- */
        body { background-color: #f8f9fa; font-family: "Microsoft JhengHei", sans-serif; height: 100vh; display: flex; flex-direction: column; }
        .header-section { background-color: #2c3e50; color: white; padding: 15px 0; flex-shrink: 0; }
        
        /* 主容器佈局 */
        .main-container { flex-grow: 1; display: flex; overflow: hidden; }
        .sidebar { width: 320px; background: white; border-right: 1px solid #dee2e6; display: flex; flex-direction: column; flex-shrink: 0; }
        .sidebar-header { padding: 15px; border-bottom: 1px solid #dee2e6; background-color: #f1f3f5; }
        .list-group-scroll { overflow-y: auto; flex-grow: 1; }
        
        .camera-group-title { font-size: 0.85rem; font-weight: bold; padding: 10px 15px; background-color: #f8f9fa; color: #6c757d; border-bottom: 1px solid #dee2e6; }
        .list-group-item { border: none; border-bottom: 1px solid #f1f1f1; cursor: pointer; padding-left: 25px; transition: 0.2s; }
        .list-group-item:hover { background-color: #e9ecef; }
        .list-group-item.active { background-color: #e9ecef; color: #2c3e50; border-left: 4px solid #0d6efd; font-weight: bold; }

        .content-area { flex-grow: 1; padding: 20px; overflow-y: auto; background-color: #ecf0f3; }
        
        /* 播放器區塊 */
        .video-player-wrapper {
            background-color: #000;
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            aspect-ratio: 16/9;
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .live-badge {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: #dc3545;
            color: white;
            padding: 5px 12px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: bold;
            z-index: 10;
            animation: pulse 1.5s infinite;
        }

        /* 載入中遮罩 */
        .loading-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0, 0, 0, 0.9);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            transition: opacity 0.5s;
        }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        /* --- CCTV 監視器特效疊層 --- */
        .cctv-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.1),
                rgba(0, 0, 0, 0.1) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
            z-index: 5;
        }

        .scanline {
            width: 100%;
            height: 80px;
            background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.15), transparent);
            position: absolute;
            animation: scan 4s linear infinite;
            pointer-events: none;
            z-index: 6;
        }

        .cctv-timestamp {
            position: absolute;
            bottom: 20px;
            left: 25px;
            color: rgba(255, 255, 255, 0.9);
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.2rem;
            font-weight: bold;
            text-shadow: 2px 2px 2px #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
            z-index: 7;
        }

        @keyframes scan {
            0% { top: -100px; }
            100% { top: 100%; }
        }

        /* --- 行動版 RWD 設定 --- */
        @media (max-width: 768px) {
            body { height: auto; min-height: 100vh; overflow-y: auto; }
            .main-container { flex-direction: column; overflow: visible; }
            .sidebar { 
                width: 100%; height: auto; max-height: 250px; 
                border-right: none; border-bottom: 5px solid #dee2e6; order: 0; 
            }
            .content-area { width: 100%; overflow: visible; padding: 15px; order: 1; }
            .video-player-wrapper { border-radius: 4px; }
            .cctv-timestamp { font-size: 0.9rem; bottom: 10px; left: 10px; }
        }
    </style>
</head>
<body>

<div class="header-section shadow-sm">
    <div class="container-fluid px-4">
        <div class="row align-items-center">
            <div class="col-md-6 col-12">
                <h4 class="m-0"><i class="fas fa-video me-2"></i>即時影像監控</h4>
            </div>
            <div class="col-md-6 col-12 text-md-end d-none d-md-block">
                <span class="badge bg-light text-dark"><i class="fas fa-user-clock me-1"></i>系統時間: <span id="sysTime">Loading...</span></span>
            </div>
        </div>
    </div>
</div>

<div class="main-container">
    
    <!-- 左側攝影機列表 -->
    <div class="sidebar">
        <div class="sidebar-header">
            <div class="d-flex justify-content-between align-items-center mb-2 d-md-none">
                <small class="text-muted">選擇監控點位</small>
                <i class="fas fa-chevron-down text-muted"></i>
            </div>
            <div class="input-group input-group-sm">
                <span class="input-group-text"><i class="fas fa-search"></i></span>
                <input type="text" class="form-control" placeholder="搜尋攝影機...">
            </div>
        </div>
        <div class="list-group-scroll">
            <div class="camera-group-title">大園區台61線大園交流道</div>
            <button class="list-group-item list-group-item-action active" onclick="loadCamera('大園區-大園-CAM01', 'CAM-DY-01', this)">
                <i class="fas fa-video me-2 text-success"></i>CAM-DY-01 (車牌)
            </button>
            <button class="list-group-item list-group-item-action" onclick="loadCamera('大園區-大園-CAM02', 'CAM-DY-02', this)">
                <i class="fas fa-video me-2 text-success"></i>CAM-DY-02 (全景)
            </button>
            <button class="list-group-item list-group-item-action" onclick="loadCamera('大園區-大園-CAM03', 'CAM-DY-03', this)">
                <i class="fas fa-video me-2 text-secondary"></i>CAM-DY-03 (夜視/離線)
            </button>
            
            <div class="camera-group-title">觀音區台61線觀音交流道</div>
            <button class="list-group-item list-group-item-action" onclick="loadCamera('觀音區-觀音-CAM01', 'CAM-GY-01', this)">
                <i class="fas fa-video me-2 text-success"></i>CAM-GY-01 (車牌)
            </button>
            <button class="list-group-item list-group-item-action" onclick="loadCamera('觀音區-觀音-CAM02', 'CAM-GY-02', this)">
                <i class="fas fa-video me-2 text-success"></i>CAM-GY-02 (全景)
            </button>

            <div class="camera-group-title">蘆竹區國道一號南崁交流道</div>
            <button class="list-group-item list-group-item-action" onclick="loadCamera('蘆竹區-南崁-CAM01', 'CAM-LZ-01', this)">
                <i class="fas fa-video me-2 text-success"></i>CAM-LZ-01 (車牌)
            </button>
        </div>
    </div>

    <!-- 右側影像顯示區 -->
    <div class="content-area">
        <div class="container-fluid p-0" style="max-width: 1200px; margin: 0 auto;">
            
            <!-- 標題列 -->
            <div class="mb-3">
                <h5 class="fw-bold m-0 text-dark" id="currentCamTitle"><i class="fas fa-camera me-2"></i>大園區-大園-CAM01</h5>
                <small class="text-muted">設備編號: <span id="currentCamID">CAM-DY-01</span></small>
            </div>

            <!-- 播放器區塊 -->
            <div class="video-player-wrapper">
                <div class="live-badge"><i class="fas fa-circle me-1"></i>LIVE</div>
                
                <!-- 載入中遮罩 -->
                <div class="loading-overlay" id="loadingOverlay" style="opacity: 0; pointer-events: none;">
                    <i class="fas fa-spinner fa-spin fa-3x mb-3 text-primary"></i>
                    <h5>正在連接影像串流...</h5>
                    <small class="text-white-50">RTSP/HLS Protocol</small>
                </div>

                <!-- 本機影片播放 (穩定的展示方案) -->
                <!-- 請確保您的影片檔名為 demo_video.mp4，且與此 HTML 檔案位於同一個資料夾 -->
                <video id="liveStreamVideo" autoplay loop muted playsinline style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; transition: opacity 0.3s;">
                    <source src="demo_video.mp4" type="video/mp4">
                    您的瀏覽器不支援 HTML5 影片。
                </video>

                <!-- CCTV 雜訊、掃描線與時間疊層 (覆蓋在影片上) -->
                <div class="cctv-overlay"></div>
                <div class="scanline"></div>
                <div class="cctv-timestamp" id="cctvTime">Loading...</div>
            </div>

            <!-- 設備技術資訊 -->
            <div class="row mt-4">
                <div class="col-md-12">
                    <div class="card border-0 shadow-sm">
                        <div class="card-body bg-white rounded">
                            <h6 class="fw-bold border-bottom pb-2 mb-3"><i class="fas fa-info-circle me-2 text-primary"></i>串流技術資訊</h6>
                            <div class="row text-muted small">
                                <div class="col-sm-3 mb-2"><strong>影像解析度：</strong> 1920 x 1080 (1080p)</div>
                                <div class="col-sm-3 mb-2"><strong>影格率 (FPS)：</strong> 30 fps</div>
                                <div class="col-sm-3 mb-2"><strong>傳輸協定：</strong> HLS (HTTP Live Streaming)</div>
                                <div class="col-sm-3 mb-2"><strong>網路延遲：</strong> <span class="text-success">穩定 (18ms)</span></div>
                                <div class="col-sm-3 mb-2"><strong>視訊編碼：</strong> H.264 / MPEG-4 AVC</div>
                                <div class="col-sm-3 mb-2"><strong>音訊通道：</strong> 已靜音 / 無收音</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // 格式化數字補零
    function pad(num) { return num.toString().padStart(2, '0'); }

    // 系統時間與監視器時間戳記同步更新
    setInterval(() => {
        const now = new Date();
        const dateStr = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
        const timeStr = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
        
        // 更新右上角系統時間
        document.getElementById('sysTime').innerText = `${dateStr} ${timeStr}`;
        // 更新畫面左下角監視器時間 (模擬 OSD)
        const camId = document.getElementById('currentCamID').innerText;
        document.getElementById('cctvTime').innerText = `${camId}  ${dateStr} ${timeStr}`;
    }, 1000);

    // 模擬切換攝影機時的載入效果
    function loadCamera(name, id, element) {
        // 更新 UI 標題
        document.getElementById('currentCamTitle').innerHTML = `<i class="fas fa-camera me-2"></i>${name}`;
        document.getElementById('currentCamID').innerText = id;
        
        // 更新左側選單狀態
        document.querySelectorAll('.list-group-item').forEach(el => el.classList.remove('active'));
        element.classList.add('active');

        // 觸發載入遮罩動畫
        const overlay = document.getElementById('loadingOverlay');
        const videoElement = document.getElementById('liveStreamVideo');
        
        overlay.style.opacity = '1';
        
        // 如果是標記為離線的攝影機
        if (name.includes('離線')) {
            setTimeout(() => {
                overlay.innerHTML = `
                    <i class="fas fa-video-slash fa-3x mb-3 text-danger"></i>
                    <h5 class="text-danger">設備已離線</h5>
                    <small class="text-white-50">無法取得 RTSP 串流，請檢查設備電源或網路</small>
                `;
                videoElement.style.opacity = '0'; // 隱藏影片
            }, 800);
            return;
        }

        // 正常攝影機切換 (重置遮罩內容)
        overlay.innerHTML = `
            <i class="fas fa-spinner fa-spin fa-3x mb-3 text-primary"></i>
            <h5>正在連接影像串流...</h5>
            <small class="text-white-50">RTSP/HLS Protocol</small>
        `;
        
        // 重置並重新播放本地影片
        videoElement.style.opacity = '1';
        videoElement.currentTime = 0;
        videoElement.play();
        
        // 模擬網路延遲後移除遮罩
        setTimeout(() => {
            overlay.style.opacity = '0';
        }, 1500);
    }
</script>

</body>
</html>
